<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Карины.. Биение моего сердца</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap');
        
        :root { --accent: #ff4d6d; --bg: #fff0f3; }
        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: var(--bg); overflow-x: hidden; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .slide { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s ease-in-out; text-align: center; background: var(--bg); padding: 20px; box-sizing: border-box; }
        .hidden { transform: scale(0.8); opacity: 0; pointer-events: none; }
        
        .card { background: white; padding: 35px; border-radius: 30px; box-shadow: 0 20px 40px rgba(255, 77, 109, 0.15); width: 100%; max-width: 400px; border: 1px solid #ffccd5; }
        
        h1 { color: var(--accent); font-family: 'Pacifico', cursive; font-size: 1.8rem; margin-bottom: 20px; }
        p { color: #594145; line-height: 1.8; font-size: 1.1rem; }
        
        .btn { background: var(--accent); color: white; border: none; padding: 12px 35px; border-radius: 50px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 1rem; transition: 0.3s; box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3); }
        
        .cassette { background: #1a1a1a; color: #ff4d6d; padding: 25px; border-radius: 20px; margin: 15px 0; border-bottom: 6px solid #000; }
        
        #lyrics-zone { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; color: #c9184a; line-height: 1.8; white-space: pre-line; font-weight: 500; }
        
        .lyrics-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 0 50px rgba(0,0,0,0.2); z-index: 2000; text-align: center; border: 2px solid var(--accent); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; }
        
        .bear-icon { font-size: 60px; margin-bottom: 10px; }
        .heart { position: fixed; top: -20px; font-size: 24px; z-index: 1000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="player"><source src="music.mp3" type="audio/mpeg"></audio>

    <div class="slide" id="s1">
        <div class="card">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZqZzR4eXh6eXh6eXh6eXh6eXh6eXh6eXh6eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" width="100">
            <h1>Для Карины.. ❤️</h1>
            <p>Прежде чем мы начнем наш новый год, я хочу сказать тебе кое-что от всего сердца..</p>
            <button class="btn" onclick="go(2)">Начать путешествие ✨</button>
        </div>
    </div>

    <div class="slide hidden" id="s2">
        <div class="card">
            <h1>Желания на 2026 год 💌</h1>
            <p>Чтобы ты всегда была рядом..<br>И чтобы мы улыбались вместе каждый миг ✨</p>
            <button class="btn" onclick="go(3)">Послушай это 🎵</button>
        </div>
    </div>

    <div class="slide hidden" id="s3">
        <div class="card">
            <h1>Особенный подарок 🎵</h1>
            <div class="cassette">
                <div style="font-weight: bold; font-size: 1.2rem;">Эта песня для тебя ❤️</div>
                <button class="btn" onclick="document.getElementById('player').play()" style="padding: 8px 20px;">Включить ▶️</button>
            </div>
            <button class="btn" onclick="go(4)">Последнее послание 💌</button>
        </div>
    </div>

    <div class="slide hidden" id="s4">
        <div class="card">
            <h1 id="intro-msg" style="min-height: 80px;"></h1>
            <button class="btn" id="lyricsBtn" style="display:none;" onclick="showLyrics()">Прочитать слова песни 📖</button>
            <br>
            <button class="btn" onclick="location.reload()" style="font-size: 0.7rem; background: #999; margin-top: 20px;">Начать сначала</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="lyrics-modal" id="modal">
        <div class="bear-icon">🧸💖</div>
        <div id="lyrics-zone"></div>
        <button class="btn" onclick="closeLyrics()" style="background:#999; padding: 8px 20px;">Закрыть</button>
    </div>

    <script>
        function go(n) {
            document.querySelectorAll('.slide').forEach(s => s.classList.add('hidden'));
            document.getElementById('s' + n).classList.remove('hidden');
            if(n === 4) { startHearts(); typeIntro(); }
        }

        function startHearts() {
            setInterval(() => {
                const h = document.createElement('div');
                h.className = 'heart'; h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 4000);
            }, 300);
        }

        const introTxt = "Как поется в песне:";
        let i = 0;
        function typeIntro() {
            if (i < introTxt.length) {
                document.getElementById("intro-msg").innerHTML += introTxt.charAt(i);
                i++; setTimeout(typeIntro, 100);
            } else {
                document.getElementById("lyricsBtn").style.display = "inline-block";
            }
        }

        const lyrics = `"You’re the only thing on my mind"
"I get chest pain when you’re not around"

Ты не просто моя подруга.. Ты — свет, который наполняет мой мир.
Я надеюсь, что этот год станет одним из самых прекрасных, и желаю тебе всегда улыбаться.. ❤️`;

        function showLyrics() {
            document.getElementById("overlay").style.display = "block";
            document.getElementById("modal").style.display = "block";
            document.getElementById("lyrics-zone").innerHTML = "";
            let j = 0;
            function typeLyrics() {
                if (j < lyrics.length) {
                    document.getElementById("lyrics-zone").innerHTML += lyrics.charAt(j);
                    j++; setTimeout(typeLyrics, 70);
                }
            }
            typeLyrics();
        }

        function closeLyrics() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("modal").style.display = "none";
        }
    </script>
</body>
</html>
